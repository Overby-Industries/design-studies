<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>
  <text x="280" y="22" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Finding the Neutral Point by trial and error (Cm vs α)</text>
  <text x="280" y="38" font-size="11" fill="#888888" text-anchor="middle">Re-run the same polar with XCmRef moved, until the middle curve appears</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="480" y2="300" stroke="#333333" stroke-width="1.3"/>
  <line x1="80" y1="60" x2="80" y2="300" stroke="#333333" stroke-width="1.3"/>
  <text x="490" y="304" font-size="12" fill="#333333">α</text>
  <text x="60" y="55" font-size="12" fill="#333333">Cm</text>
  <line x1="80" y1="180" x2="480" y2="180" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="70" y="184" font-size="10.5" fill="#888888" text-anchor="end">Cm=0</text>

  <!-- CG forward of NP: negative slope, stable -->
  <line x1="120" y1="90" x2="440" y2="270" stroke="#3d6b52" stroke-width="2.4"/>
  <circle cx="280" cy="180" r="4.5" fill="#3d6b52"/>
  <text x="440" y="285" font-size="11.5" fill="#3d6b52" text-anchor="end">CG forward of NP — stable (negative slope)</text>

  <!-- CG at NP: flat, marginal -->
  <line x1="120" y1="180" x2="440" y2="180" stroke="#c9a227" stroke-width="2.4"/>
  <text x="440" y="170" font-size="11.5" fill="#a3841f" text-anchor="end">CG = NP — Cm independent of α (marginal)</text>

  <!-- CG aft of NP: positive slope, unstable -->
  <line x1="120" y1="270" x2="440" y2="90" stroke="#b1462f" stroke-width="2.4"/>
  <circle cx="280" cy="180" r="4.5" fill="#b1462f"/>
  <text x="440" y="80" font-size="11.5" fill="#b1462f" text-anchor="end">CG aft of NP — unstable (positive slope)</text>

  <!-- balance point marker -->
  <line x1="280" y1="60" x2="280" y2="300" stroke="#999999" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="280" y="316" font-size="11" fill="#666666" text-anchor="middle">αe (trim angle where Cm = 0)</text>

  <text x="280" y="345" font-size="11" fill="#333333" text-anchor="middle">Static Margin SM = (X_NP − X_CG) / MAC — positive SM = stable.</text>
  <text x="280" y="364" font-size="10.5" fill="#888888" text-anchor="middle">Not the same as XFLR5's on-screen "Tail Volume" — that only measures the</text>
  <text x="280" y="378" font-size="10.5" fill="#888888" text-anchor="middle">elevator's leverage, not whether the plane actually ends up stable.</text>
</svg>
