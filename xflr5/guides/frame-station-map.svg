<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="340" fill="#ffffff"/>

  <!-- title -->
  <text x="480" y="18" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Starlifter 2 Body — suggested frame stations (side profile, not to scale)</text>

  <!-- callout labels (drawn first so leader lines sit under the silhouette edges) -->
  <text x="20" y="50" font-size="12" fill="#8a3324">Crew nose &amp; cockpit</text>
  <line x1="60" y1="55" x2="132" y2="163" stroke="#8a3324" stroke-width="1"/>

  <text x="230" y="42" font-size="12" fill="#8a3324">Canopy / cargo-bay spine (tallest)</text>
  <line x1="300" y1="47" x2="320" y2="137" stroke="#8a3324" stroke-width="1"/>

  <text x="470" y="60" font-size="12" fill="#8a3324" text-anchor="middle">Max width — blend to Main Wing&#8217;s</text>
  <text x="470" y="74" font-size="12" fill="#8a3324" text-anchor="middle">60 ft root chord across this stretch</text>
  <line x1="470" y1="78" x2="450" y2="133" stroke="#8a3324" stroke-width="1"/>

  <text x="800" y="50" font-size="12" fill="#8a3324" text-anchor="middle">Boat-tail &amp;</text>
  <text x="800" y="64" font-size="12" fill="#8a3324" text-anchor="middle">engine stations</text>
  <line x1="800" y1="68" x2="800" y2="188" stroke="#8a3324" stroke-width="1"/>

  <!-- wing blend zone highlight band -->
  <rect x="300" y="120" width="240" height="130" fill="#f4a261" opacity="0.15"/>

  <!-- body silhouette -->
  <path d="M 80,214
           C 95,195 110,178 140,168
           C 190,150 250,140 320,136
           C 400,131 470,132 540,138
           C 610,145 680,158 740,175
           C 790,190 840,200 880,212
           L 880,222
           C 840,230 790,236 740,238
           C 680,240 610,241 540,241
           C 470,241 400,240 320,238
           C 250,236 190,230 140,222
           C 110,216 95,214 80,214 Z"
        fill="#dbe4ef" stroke="#33475b" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- datum baseline -->
  <line x1="60" y1="250" x2="900" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="20" y="254" font-size="11" fill="#666666">datum</text>

  <!-- station ticks -->
  <g stroke="#33475b" stroke-width="1">
    <line x1="80" y1="246" x2="80" y2="254"/>
    <line x1="120" y1="246" x2="120" y2="254"/>
    <line x1="180" y1="246" x2="180" y2="254"/>
    <line x1="267" y1="246" x2="267" y2="254"/>
    <line x1="380" y1="246" x2="380" y2="254"/>
    <line x1="513" y1="246" x2="513" y2="254"/>
    <line x1="647" y1="246" x2="647" y2="254"/>
    <line x1="747" y1="246" x2="747" y2="254"/>
    <line x1="827" y1="246" x2="827" y2="254"/>
    <line x1="880" y1="246" x2="880" y2="254"/>
  </g>
  <g font-size="11" fill="#33475b" text-anchor="middle">
    <text x="80" y="270">0</text>
    <text x="120" y="270">6</text>
    <text x="180" y="270">15</text>
    <text x="267" y="270">28</text>
    <text x="380" y="270">45</text>
    <text x="513" y="270">65</text>
    <text x="647" y="270">85</text>
    <text x="747" y="270">100</text>
    <text x="827" y="270">112</text>
    <text x="880" y="270">120</text>
  </g>
  <text x="480" y="292" font-size="12" fill="#33475b" text-anchor="middle">Fuselage station x (ft) — nose at x = 0, tail at x = 120</text>

  <text x="480" y="320" font-size="11" fill="#888888" text-anchor="middle">Adjust station spacing to match your own sketch — add extra frames wherever the planform or profile changes slope sharply (e.g. the leading-edge kink, the boat-tail).</text>
</svg>
