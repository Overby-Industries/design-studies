<svg viewBox="0 0 660 585" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="660" height="585" fill="#ffffff"/>
  <text x="330" y="24" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Main Wing (right half) — suggested elevon span, drawn to your actual planform</text>
  <text x="330" y="40" font-size="11" fill="#888888" text-anchor="middle">Root chord 60 ft, tip chord 4.0 ft, span 100 ft (50 ft shown), sweep 35.75° — not to scale on the page, proportions are real</text>

  <!-- wing outline: root_LE, tip_LE, tip_TE, root_TE -->
  <polygon points="90,55 470,328.6 470,359.2 90,511"
           fill="#dbe4ef" stroke="#33475b" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- elevon patch -->
  <polygon points="150.8,389.7 432,356.0 432,374.4 150.8,486.7"
           fill="#f4a261" opacity="0.35" stroke="#8a3324" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- hinge line full span for reference (thin) -->
  <line x1="90" y1="397" x2="470" y2="351.6" stroke="#8a3324" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- flap-break tick pairs at each boundary -->
  <g stroke="#8a3324" stroke-width="1.5">
    <line x1="150.8" y1="80" x2="150.8" y2="95"/>
    <line x1="156.8" y1="80" x2="156.8" y2="95"/>
    <line x1="432" y1="295" x2="432" y2="310"/>
    <line x1="438" y1="295" x2="438" y2="310"/>
  </g>
  <text x="153.8" y="72" font-size="10.5" fill="#8a3324" text-anchor="middle">flap break</text>
  <text x="153.8" y="60" font-size="10.5" fill="#8a3324" text-anchor="middle">(y ≈ 8 ft)</text>
  <text x="435" y="287" font-size="10.5" fill="#8a3324" text-anchor="middle">flap break</text>
  <text x="435" y="275" font-size="10.5" fill="#8a3324" text-anchor="middle">(y ≈ 45 ft)</text>

  <!-- labels -->
  <text x="60" y="52" font-size="11" fill="#33475b" text-anchor="end">root</text>
  <text x="60" y="514" font-size="11" fill="#33475b" text-anchor="end">(chord 60 ft)</text>
  <text x="480" y="325" font-size="11" fill="#33475b" text-anchor="start">tip</text>
  <text x="480" y="362" font-size="11" fill="#33475b" text-anchor="start">(chord 4.0 ft)</text>

  <text x="290" y="440" font-size="12" fill="#8a3324" text-anchor="middle" transform="rotate(-8 290 440)">elevon (~75% chord hinge)</text>

  <!-- LE / TE direction labels -->
  <text x="20" y="200" font-size="11" fill="#666666">leading</text>
  <text x="20" y="213" font-size="11" fill="#666666">edge</text>
  <text x="20" y="440" font-size="11" fill="#666666">trailing</text>
  <text x="20" y="453" font-size="11" fill="#666666">edge</text>

  <!-- span axis -->
  <line x1="90" y1="525" x2="470" y2="525" stroke="#999999" stroke-width="1"/>
  <g font-size="10.5" fill="#666666" text-anchor="middle">
    <text x="90" y="540">y=0 (root)</text>
    <text x="150.8" y="540">8 ft</text>
    <text x="432" y="540">45 ft</text>
    <text x="470" y="540">50 ft (tip)</text>
  </g>

  <text x="330" y="561" font-size="10.5" fill="#888888" text-anchor="middle">Each flap break needs two overlapping sections in the Wing table (plain foil / flapped foil) —</text>
  <text x="330" y="574" font-size="10.5" fill="#888888" text-anchor="middle">XFLR5 ignores the zero-length panel between them.</text>
</svg>
